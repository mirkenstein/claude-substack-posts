---
services:
  weaviate:
    command:
    - --host
    - 0.0.0.0
    - --port
    - '8080'
    - --scheme
    - http
    image: cr.weaviate.io/semitechnologies/weaviate:1.30.0
    ports:
    - 8080:8080
    - 50051:50051
    volumes:
    - weaviate_data:/var/lib/weaviate
    restart: on-failure:0
    environment:
      OPENAI_APIKEY: ${OPENAI_APIKEY:-}
      COHERE_APIKEY: ${COHERE_APIKEY:-}
      JINAAI_APIKEY: ${JINAAI_APIKEY:-}
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'text2vec-jinaai'
      ENABLE_MODULES: >-
        text2vec-openai,
        text2vec-jinaai,
        reranker-jinaai,
        ref2vec-centroid,
        generative-openai,
        reranker-cohere
      CLUSTER_HOSTNAME: 'node1'
volumes:
  weaviate_data:
    external: true
    name: docker-openai_weaviate_data
...
